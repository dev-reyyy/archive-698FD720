<html lang="en" class="box-border">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="shortcut icon" href="assets/icons/archive-fill.svg" type="image/x-icon">
    <title>Archive [698FD720]</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.8.0/fonts/remixicon.min.css">

<body class="h-screen overflow-hidden font-mono">
    <main class="bg-gray-950 flex p-4 md:p-12 min-h-screen">
        <div class="bg-neutral-800 border border-neutral-700 m-auto w-full md:w-4xl h-140 rounded-none md:rounded-lg overflow-hidden">
            <div class="h-full flex flex-col justify-between">
                <!-- HEADER -->
                <div class="flex items-center justify-end gap-4 px-4 py-2 bg-neutral-900 text-neutral-400">
                    <!-- SORT SELECTION -->
                    <div class="relative text-xs">
                        <details class="group">
                            <summary class="flex items-center gap-3 cursor-pointer select-none px-3 py-2 border border-neutral-400 rounded text-neutral-300 hover:bg-neutral-800">
                                <div class="flex items-center gap-1">
                                    <i class="ri-sort-asc icon icon-sm"></i>
                                    <span>Sort</span>
                                </div>
                                <i class="ri-arrow-down-s-line icon icon-sm transition group-open:rotate-180"></i>
                            </summary>

                            <!-- Dropdown -->
                            <div class="absolute left-0 mt-1 w-48 bg-neutral-900 border border-neutral-700 rounded shadow-lg z-50">
                                <!-- Sort by -->
                                <div class="px-3 py-2 text-neutral-400 text-[11px] uppercase">
                                    Sort by
                                </div>

                                <label class="flex items-center gap-2 px-3 py-2 cursor-pointer hover:bg-neutral-800">
                                    <input type="radio" name="sort_by" value="name" class="sr-only peer" checked>
                                    <i class="ri-check-line icon icon-sm peer-checked:opacity-100 opacity-0"></i>
                                    <span>Name</span>
                                </label>

                                <label class="flex items-center gap-2 px-3 py-2 cursor-pointer hover:bg-neutral-800">
                                    <input type="radio" name="sort_by" value="size" class="sr-only peer">
                                    <i class="ri-check-line icon icon-sm peer-checked:opacity-100 opacity-0"></i>
                                    <span>Size</span>
                                </label>

                                <label class="flex items-center gap-2 px-3 py-2 cursor-pointer hover:bg-neutral-800">
                                    <input type="radio" name="sort_by" value="created_at" class="sr-only peer">
                                    <i class="ri-check-line icon icon-sm peer-checked:opacity-100 opacity-0"></i>
                                    <span>Created at</span>
                                </label>

                                <div class="border-t border-neutral-700 my-1"></div>

                                <!-- Order -->
                                <div class="px-3 py-2 text-neutral-400 text-[11px] uppercase">
                                    Order
                                </div>

                                <label class="flex items-center gap-2 px-3 py-2 cursor-pointer hover:bg-neutral-800">
                                    <input type="radio" name="sort_order" value="asc" class="sr-only peer" checked>
                                    <i class="ri-check-line icon icon-sm peer-checked:opacity-100 opacity-0"></i>
                                    <span>Ascending</span>
                                </label>

                                <label class="flex items-center gap-2 px-3 py-2 cursor-pointer hover:bg-neutral-800">
                                    <input type="radio" name="sort_order" value="desc" class="sr-only peer">
                                    <i class="ri-check-line icon icon-sm peer-checked:opacity-100 opacity-0"></i>
                                    <span>Descending</span>
                                </label>
                            </div>
                        </details>
                    </div>

                    <!-- VIEW SELECTION -->
                    <div>
                        <ul class="flex text-xs">
                            <li>
                                <label class="cursor-pointer">
                                    <input type="radio" name="view" value="icons" class="sr-only peer" checked>
                                    <span class="flex items-center justify-center p-2 border border-neutral-400
                                                peer-checked:bg-neutral-800 hover:bg-neutral-800 peer-checked:text-white rounded-l">
                                        <i class="ri-image-line icon icon-sm"></i>
                                    </span>
                                </label>
                            </li>

                            <li>
                                <label class="cursor-pointer">
                                    <input type="radio" name="view" value="details" class="sr-only peer">
                                    <span class="flex items-center justify-center p-2 border border-neutral-400

                                        <i class="ri-list-check icon icon-sm"></i>
                                    </span>
                                </label>
                            </li>

                    </div>

                <div class="flex flex-wrap justify-center sm:justify-start h-full gap-4 text-neutral-300 p-4 content-start">

                        tabindex="0"

                        </div>

                                <p class="w-full break-words text-sm text-center">
                                    foreword.md
                                </p>
                            </div>
                        </div>
                    </div>

                    <div class="desktop-icon h-fit rounded select-none duration-200"

                                <i class="icon icon-lg ri-file-damage-line"></i>
                                <p class="w-full break-words text-sm text-center">
                                    interval.pdf
                                </p>
                            </div>
                        </div>
                    </div>

                    <div class="desktop-icon h-fit rounded select-none duration-200"

                        role="button">

                            <div class="flex flex-col items-center gap-1">
                                <i class="icon icon-lg ri-file-image-line"></i>
                                <p class="w-full break-words text-sm text-center">
                                    margin.jpg
                                </p>
                            </div>
                        </div>
                    </div>

                    <div class="desktop-icon h-fit rounded select-none duration-200"

                        tabindex="0"

                        <div class="postscript-file-container w-26 px-2 py-3 hover:bg-neutral-400/10 duration-200 rounded cursor-pointer opacity-30">
                            <div class="flex flex-col items-center gap-1">
                                <i class="icon icon-lg ri-lock-line"></i>
                                <p class="w-full break-words text-sm text-center">

                            </div>
